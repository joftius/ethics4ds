project:
  type: website
  output-dir: docs
  # Each week is weeks/wkNN/: student files at the folder root, the complete
  # class sheet and the teacher note under wkNN/instructor/. The site render
  # never renders or copies instructor/; _build_env/build.sh renders those two
  # files on their own and publishes them at the unlinked teacher paths
  # (docs/class-teachers/wkNN/, and docs/decks-notes/wkNN/ for the deck with
  # speaker notes). The 2022 week pages weeks/NN-*.qmd stay in the tree
  # unrendered until they are retired. Whatever wkNN folders are in this tree
  # are live.
  render:
    - "index.qmd"
    - "about.qmd"
    - "weeks/wk*/*.qmd"
    - "!weeks/wk*/_index.qmd"
    - "!**/instructor/**"
    - "!**/*_complete.qmd"
    - "!_build_env/**"
    - "!_templates/**"
    - "!_instructor_rendered/**"
    - "!_registry/**"
  # The student class sheet is copied beside its HTML so students can download
  # it to run the R code. Notes and slides sources are not copied: they carry
  # the instructor-side st313: block.
  resources:
    - "files/**"
    - "weeks/wk*/class.qmd"
    - "!**/instructor/**"
    - "!**/*_complete.qmd"
  preview:
    port: 4313
    browser: false

website:
  title: "{{< fa solid chart-simple size=large >}} ethics 4 data science"
  navbar:
    lowercase: true
    right:
    - text: "references"
      menu:
      - text: "Bit by Bit"
        href: https://www.bitbybitbook.com/en/1st-ed/ethics/
      - text: "Fairness and Machine Learning"
        href: https://fairmlbook.org/
      - text: "Data Feminism"
        href: https://data-feminism.mitpress.mit.edu/
      - text: "RSS Guidelines"
        href: https://rss.org.uk/RSS/media/News-and-publications/Publications/Reports%20and%20guides/A-Guide-for-Ethical-Data-Science-Final-Oct-2019.pdf
      - text: "ASA Guidelines"
        href: https://www.amstat.org/your-career/ethical-guidelines-for-statistical-practice
      - text: "ACM Guidelines"
        href: https://www.acm.org/code-of-ethics
    - text: "{{< fa solid house size=large >}} content"
      file: index.qmd
    - text: "{{< fa solid user size=large >}} about"
      file: about.qmd
  site-url: https://ethics4ds.com

format:
  html:
    cookie_consent:
      style: simple
      type: express
      palette: light
      lang: en
      cookies_policy: url
    citations: false
    theme: cosmo
    css: styles.css
    toc: true

# Math: MathJax 4, Quarto 1.10's version when a page asks for mathjax. Set here for
# every page because a revealjs deck with no html-math-method gets MathJax 2.7.9.
# A deck does not set its own. The two layout rules that decks need with version 4
# are at the end of theme/st313.scss; styles.css has the same two for the pages.
html-math-method: mathjax

editor: source
execute:
  freeze: auto
